<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Recent Matches</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family: Inter, sans-serif;
background:#071A12;
color:white;
margin:0;
padding:40px;
}

h1{
margin-bottom:30px;
}

table{
width:100%;
border-collapse:collapse;
background:#0f2c22;
border-radius:10px;
overflow:hidden;
}

th,td{
padding:12px 14px;
text-align:left;
border-bottom:1px solid #1f4a3a;
}

th{
background:#0b231a;
font-weight:600;
}

tr:hover{
background:#12382b;
}

.score{
font-weight:700;
color:#00ff9c;
}
</style>

</head>

<body>

<h1>Recent Matches</h1>

<table id="matchesTable">
<thead>
<tr>
<th>Date</th>
<th>Player A</th>
<th>Player B</th>
<th>Score</th>
<th>Court</th>
</tr>
</thead>

<tbody></tbody>
</table>

<script>

async function loadMatches(){

const res = await fetch("https://api.escoreboards.eu/api/matches?limit=100")
const data = await res.json()

const tbody = document.querySelector("#matchesTable tbody")

data.items.forEach(m => {

const date = new Date(m.finishedAt)

const tr = document.createElement("tr")

tr.innerHTML = `
<td>${date.toLocaleString()}</td>
<td>${m.playerA}</td>
<td>${m.playerB}</td>
<td class="score">${m.setsA}-${m.setsB}</td>
<td>${m.courtKey.split("/").pop()}</td>
`

tbody.appendChild(tr)

})

}

loadMatches()

</script>

</body>
</html>
