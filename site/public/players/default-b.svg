<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="40%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#5c526b"/>
      <stop offset="58%" stop-color="#302b3b"/>
      <stop offset="100%" stop-color="#171421"/>
    </radialGradient>

    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dddce2"/>
      <stop offset="55%" stop-color="#b6b0bc"/>
      <stop offset="100%" stop-color="#807887"/>
    </linearGradient>

    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332d3d"/>
      <stop offset="100%" stop-color="#16121d"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10"
        flood-color="#000000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#bg)"/>

  <circle cx="203" cy="41" r="72"
    fill="#9b58ce" opacity=".13"/>

  <g filter="url(#shadow)">
    <!-- shoulders -->
    <path
      d="M41 256c5-55 36-87 87-87
         50 0 81 32 87 87Z"
      fill="url(#shirt)"
    />

    <!-- neck -->
    <path
      d="M105 144h46v43h-46Z"
      fill="#9d98a3"
    />

    <!-- head -->
    <ellipse
      cx="128"
      cy="102"
      rx="46"
      ry="58"
      fill="url(#face)"
    />

    <!-- short formal hair -->
    <path
      d="M83 94c0-42 18-64 47-64
         33 0 49 22 48 60
         -12-10-28-16-45-16
         -19 0-35 6-50 20Z"
      fill="#211d27"
    />

    <path
      d="M90 75c11-24 26-35 45-35
         19 0 32 8 40 25
         -15-6-29-8-44-6
         -17 1-29 6-41 16Z"
      fill="#332c3a"
    />

    <!-- face shadow -->
    <path
      d="M128 46c27 0 46 22 46 56
         0 34-19 58-46 58Z"
      fill="#665f6c"
      opacity=".23"
    />

    <!-- collar -->
    <path
      d="M105 169l23 22-26 24-18-37Z"
      fill="#eeeaf0"
      opacity=".92"
    />

    <path
      d="M151 169l-23 22 26 24 18-37Z"
      fill="#ddd7e2"
      opacity=".92"
    />

    <path
      d="M128 191l17 65h-34Z"
      fill="#8d4cbd"
      opacity=".9"
    />
  </g>
</svg>
