<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="42%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#486169"/>
      <stop offset="55%" stop-color="#24383e"/>
      <stop offset="100%" stop-color="#102329"/>
    </radialGradient>

    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7dde0"/>
      <stop offset="55%" stop-color="#abb7bc"/>
      <stop offset="100%" stop-color="#75858b"/>
    </linearGradient>

    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21353d"/>
      <stop offset="100%" stop-color="#09171c"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10"
        flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#bg)"/>

  <circle cx="204" cy="42" r="72"
    fill="#17c0c8" opacity=".12"/>

  <g filter="url(#shadow)">
    <!-- shoulders / sports jacket -->
    <path
      d="M43 256c4-54 35-87 85-87s81 33 85 87Z"
      fill="url(#shirt)"
    />

    <!-- neck -->
    <path
      d="M105 145h46v42h-46Z"
      fill="#9aa7ac"
    />

    <!-- head -->
    <ellipse
      cx="128"
      cy="103"
      rx="47"
      ry="58"
      fill="url(#face)"
    />

    <!-- professional hair silhouette -->
    <path
      d="M82 99c1-45 19-67 49-67 34 0 49 22 47 61
         -10-12-23-19-42-20
         -22-1-37 8-54 26Z"
      fill="#1a262b"
    />

    <path
      d="M87 88c8-32 26-47 49-47 22 0 35 10 43 30
         -17-8-34-10-52-7
         -16 2-29 10-40 24Z"
      fill="#27363c"
    />

    <!-- subtle face shadow, keeps it serious / neutral -->
    <path
      d="M128 48c28 0 47 22 47 55
         0 34-20 58-47 58Z"
      fill="#607178"
      opacity=".24"
    />

    <!-- collar -->
    <path
      d="M105 169l23 22-26 24-18-37Z"
      fill="#e8eef0"
      opacity=".92"
    />

    <path
      d="M151 169l-23 22 26 24 18-37Z"
      fill="#dbe4e7"
      opacity=".92"
    />

    <path
      d="M128 191l17 65h-34Z"
      fill="#0aa8b1"
      opacity=".85"
    />
  </g>
</svg>
